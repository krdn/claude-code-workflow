# 링크 검사
# 문서 내 깨진 링크를 자동으로 검사합니다.

name: Link Check

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/link-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/link-check.yml"
  # 매주 월요일 09:00 (KST) 정기 검사
  schedule:
    - cron: "0 0 * * 1"
  # 수동 실행
  workflow_dispatch:

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --verbose
            --no-progress
            --accept 200,204,206,301,302,403,429
            --exclude-path node_modules
            --exclude "^https://github.com/krdn/claude-code-workflow/compare"
            --exclude "^https://github.com/krdn/claude-code-workflow/issues/new"
            '**/*.md'
          fail: false

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🔗 깨진 링크 발견';
            const body = `
            ## 링크 검사 실패

            워크플로 실행에서 깨진 링크가 발견되었습니다.

            **워크플로 실행**: [링크](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            자세한 내용은 위 링크에서 확인해 주세요.
            `;

            // 이미 열린 이슈가 있는지 확인
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'type: bug'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['type: bug', 'category: docs']
              });
            }
